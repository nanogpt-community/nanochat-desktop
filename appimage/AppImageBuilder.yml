version: 1

AppDir:
  path: ./AppDir
  app_info:
    id: com.nanogpt.NanoChat
    name: NanoChat
    icon: com.nanogpt.NanoChat
    version: 0.1.0
    exec: usr/bin/nanochat
    exec_args: $@

  apt:
    arch: amd64
    sources:
      - sourceline: 'deb [arch=amd64] http://archive.ubuntu.com/ubuntu/ jammy main restricted universe multiverse'
      - sourceline: 'deb [arch=amd64] http://archive.ubuntu.com/ubuntu/ jammy-updates main restricted universe multiverse'
    include:
      - python3
      - python3-pip
      - python3-gi
      - python3-gi-cairo
      - gir1.2-gtk-4.0
      - gir1.2-adw-1
      - libgirepository-1.0-1
      - libglib2.0-0
      - libcairo2
      - libpango-1.0-0
      - libpangocairo-1.0-0
      - libsecret-1-0
    exclude: []

  python:
    version: 3.10
    venv:
      path: venv
      pypi_url: https://pypi.org/simple
      requirements: requirements.txt

  files:
    include: []
    exclude:
      - usr/share/man
      - usr/share/doc/*/README.*
      - usr/share/doc/*/changelog.*
      - usr/share/doc/*/NEWS.*
      - usr/share/doc/*/TODO.*

AppImage:
  arch: x86_64
  update-information: guess
  sign-key: None
  file_name: NanoChat-0.1.0-x86_64.AppImage
